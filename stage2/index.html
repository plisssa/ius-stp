<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>СТП · Обращения</title>
<style>
:root{--ink:#172c33;--teal:#116253;--dim:#546b71;--line:#d7e1de;--paper:#fff;--mint:#e5f2ec}
*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f3f6f4;font:15px/1.48 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{height:64px;background:#193932;color:white;display:flex;align-items:center;gap:12px;padding:0 3vw}.brand{font-size:16px;letter-spacing:1px;border:1px solid #77978c;border-radius:7px;padding:3px 8px}header strong{font-size:18px}.who{margin-left:auto;font-size:14px;color:#d6e7de}
main{display:grid;grid-template-columns:minmax(280px,30%) minmax(0,1fr);max-width:1550px;margin:auto;min-height:calc(100vh - 64px)}aside{background:#fbfcfb;border-right:1px solid var(--line);min-width:0}.filters{padding:21px 18px 13px;border-bottom:1px solid var(--line)}h1,h2,h3,p{margin:0}h1{font-size:clamp(22px,2.3vw,36px);line-height:1.17;letter-spacing:-.9px}h2{font-size:19px;letter-spacing:-.4px}h3{font-size:15px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.count,.pill{border-radius:5px;font-size:12px;padding:3px 7px;background:#e7ece9;color:#38544c;font-weight:650}.p2{background:#fbe5dd;color:#81432e}.p3{background:#f8edce;color:#755817}.p4{background:#e4eff7;color:#35627a}.good{background:var(--mint);color:var(--teal)}small,.muted{color:var(--dim);font-size:13px}input,select,textarea,button{font:inherit}input,select,textarea{border:1px solid #b8c9c2;border-radius:6px;background:white;color:var(--ink)}input{width:100%;padding:10px 11px;margin:14px 0 9px}select{padding:6px 8px;max-width:100%;font-size:13px}.queue{overflow:auto;max-height:calc(100dvh - 240px)}button{cursor:pointer;border-radius:6px;border:1px solid #acc2b9;background:white;color:#274b40;padding:8px 12px;font-weight:600}button.primary{background:var(--teal);color:white;border-color:var(--teal)}button:disabled{cursor:default;opacity:.5}:focus-visible{outline:3px solid #319a86;outline-offset:2px}.ticket{background:transparent;border:0;border-bottom:1px solid #e2e9e5;border-radius:0;width:100%;text-align:left;padding:13px 18px;display:grid;gap:5px;color:var(--ink)}.ticket.active{background:#e5f1eb;box-shadow:inset 4px 0 var(--teal)}.ticket:hover{background:#edf3ef}.ticket strong{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}.ticket small{font-weight:450}.detail{padding:28px clamp(18px,3vw,46px);min-width:0}.heading{display:grid;gap:10px;margin-bottom:24px}.columns{display:grid;grid-template-columns:minmax(0,1fr) minmax(190px,28%);gap:16px}.card{border:1px solid var(--line);border-radius:10px;background:white;padding:18px;margin-bottom:14px;min-width:0}.body{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:12px}.label{font-size:12px;color:var(--dim);font-weight:600}.context p{margin:4px 0 14px}.source{background:#eff6f2;color:#355c4b;padding:10px;margin:10px 0;border-radius:5px}textarea{display:block;width:100%;resize:vertical;min-height:98px;padding:10px;margin:12px 0}.list{margin:12px 0 0;padding:0;list-style:none}.list li{border-top:1px solid var(--line);padding:9px 0;overflow-wrap:anywhere}.list time{color:var(--dim);font-size:12px}.notice{margin:8px 0;color:#155744}details summary{cursor:pointer;font-weight:650}.blank{padding:26px;color:var(--dim)}[hidden]{display:none!important}@media(max-width:1050px){.columns{display:flex;flex-direction:column}.context{order:2}}@media(max-width:700px){header{height:54px}.who{font-size:12px}main{display:block}.queue{max-height:175px}.detail,.filters{padding:15px}.ticket{padding:8px 15px}.card{padding:14px}}
</style></head><body>
<header><b class="brand">СТП</b><strong>Рабочее место</strong><span class="who" id="who"></span></header>
<main><aside><div class="filters"><div class="row spread"><h2>Обращения</h2><span class="count" id="count"></span></div><input type="search" id="search" aria-label="Поиск обращений" placeholder="Номер, тема или текст"><div class="row"><select id="status" aria-label="Фильтр по статусу"><option value="">Все статусы</option><option>Waiting for support</option><option>Waiting for customer</option></select><select id="priority" aria-label="Фильтр по приоритету"><option value="">Все приоритеты</option><option>P2</option><option>P3</option><option>P4</option></select></div></div><div class="queue" id="queue"></div></aside>
<section class="detail"><p class="notice" id="feedback" role="status"></p><div id="content"><div class="heading"><div class="row"><b id="number"></b><span id="badge" class="pill"></span><span id="state" class="pill good"></span></div><h1 id="title"></h1></div>
<div class="columns"><div><article class="card"><h3>Сообщение клиента</h3><p class="body" id="body"></p></article><article class="card" id="editor"><div class="row spread"><h2>Первый ответ</h2><button id="suggest">Подготовить черновик</button></div><div id="reference" class="source" hidden></div><textarea id="answer" aria-label="Ответ клиенту" placeholder="Напишите ответ клиенту"></textarea><div class="row" id="actions"></div></article><article class="card" id="sent" hidden><h3>Ответ инженера</h3><p class="body" id="sentText"></p></article>
<details class="card" id="history"><summary>Журнал обращения <span id="events" class="count"></span></summary><ol class="list" id="log"></ol></details></div>
<div class="context"><section class="card"><h3>Параметры</h3><hr style="border:0;border-top:1px solid var(--line)"><span class="label">Первый ответ по SLA</span><p id="sla"></p><span class="label">Срок первого ответа</span><p id="due"></p><span class="label">Исполнитель</span><p id="assignee"></p><span class="label">Зарегистрирована</span><p id="registered"></p><span class="label">Организация</span><p id="org"></p><span class="label">Тема</span><p id="topic"></p></section><section class="card"><h3>База знаний</h3><p class="label" id="kbId"></p><p id="kbText"></p></section></div></div></div></section></main>
<script src="./pages-demo.js" defer></script>
<script>
let demo;
const el=id=>document.getElementById(id);
let rows=[],session={},selected='ES-9101',busy=false,loading=false;
function node(tag,text,cls){const n=document.createElement(tag);n.textContent=text;if(cls)n.className=cls;return n}
function current(){return rows.find(x=>x.id===selected)}
function pending(t){return t?.proposals.find(x=>!x.decision)}
function key(){return 'stp:'+session.actor+':'+selected+':'+(pending(current())?.id||'manual')}
function when(s){return s?new Date(s*1000).toLocaleString('ru-RU',{timeZone:session.sla.tz,day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—'}
function hours(){const c=session.sla;return c.hours==='working'?'рабочие часы '+c.start+':00–'+c.end+':00'+(c.tz==='Europe/Moscow'?' МСК':' '+c.tz):'календарные часы'}
function notice(text){el('feedback').textContent=text}
async function get(path){if(demo)return demo.get(path);const r=await fetch(path,{cache:'no-store'});if(!r.ok)throw Error('Не удалось загрузить данные');return r.json()}
function timer(){const t=current();if(!t)return;const m=Math.ceil((t.deadline-Date.now()/1000)/60);el('sla').textContent=t.answer?(t.answered<=t.deadline?'Ответ дан в срок':'Ответ дан с нарушением срока'):m<=0?'Просрочено на '+(-m)+' мин':m>=60?Math.floor(m/60)+' ч '+m%60+' мин':m+' мин'}
function list(selectFirst=false){const q=el('search').value.trim().toLowerCase(),s=el('status').value;
 const matches=rows.filter(t=>(!s||t.status===s)&&(!el('priority').value||t.priority===el('priority').value)&&(!q||[t.id,t.title,t.body,t.topic].join(' ').toLowerCase().includes(q)));
 el('count').textContent=matches.length+' / '+rows.length;
 if(selectFirst&&!matches.some(t=>t.id===selected))selected=matches[0]?.id||'';
 el('queue').replaceChildren(...matches.map(t=>{const b=node('button','','ticket'+(t.id===selected?' active':''));b.disabled=busy;b.setAttribute('aria-pressed',String(t.id===selected));const line=node('div','','row spread');line.append(node('small',t.id),node('span',t.priority,'pill '+t.priority.toLowerCase()));b.append(line,node('strong',t.title),node('small',t.answer?'Ответ дан':t.topic));b.onclick=()=>{selected=t.id;notice('');list();detail()};return b}));
 if(!matches.length)el('queue').append(node('p','Обращений по этому запросу нет','blank'))
}
function actions(){const t=current();if(!t)return;const p=pending(t),value=el('answer').value.trim();
 const options=p?[[value===p.draft?'Принять':'Изменить',value===p.draft?'Принять черновик':'Отправить с правками'],['Отклонить','Отклонить']]:[['Вручную','Отправить ответ']];
 el('actions').replaceChildren(...options.map(([a,title],i)=>{const b=node('button',title,i?'':'primary');b.disabled=busy||(!value&&a!=='Отклонить');b.onclick=()=>send('/decision',{action:a,text:value,proposal:p?.id});return b}))
}
function detail(){const t=current();el('content').hidden=!t;if(!t)return;const p=pending(t),kb=session.articles.find(a=>a.topic===t.topic);
 for(const [id,v] of Object.entries({number:t.id,title:t.title,body:t.body,org:t.org,topic:t.topic,kbId:kb?.id||'',kbText:kb?.text||'',badge:t.priority,state:t.status,assignee:t.assignee||'Unassigned',registered:when(t.registered),due:when(t.deadline)+' · '+hours(),events:t.log.length,sentText:t.answer||''}))el(id).textContent=v;
 el('badge').className='pill '+t.priority.toLowerCase();el('sent').hidden=!t.answer;el('editor').hidden=!!t.answer;el('suggest').hidden=!!demo;el('suggest').disabled=busy||!!p;el('suggest').textContent=busy?'Обработка…':'Подготовить черновик';
 el('answer').disabled=busy;el('answer').value=sessionStorage.getItem(key())??p?.draft??'';el('reference').hidden=!p&&!demo;el('reference').textContent=demo?'Демонстрация в браузере. Ответ сохраняется только в вашей вкладке. ИИ доступен на серверном стенде.':p?'Черновик по '+p.source+' · Оценка модели '+p.confidence:'';
 el('log').replaceChildren(...t.log.map(e=>{const li=node('li','');li.append(node('b',e.event+' '),node('time',new Date(e.at).toLocaleTimeString('ru-RU',{timeZone:session.sla.tz})+' · '+e.actor));const d=node('details','');d.append(node('summary','Подробности'),node('small',e.detail));li.append(d);return li}));timer();actions()
}
async function refresh(){rows=await get('/state');list(true);detail()}
async function send(path,fields){if(busy||loading)return;const old=key();busy=true;list();detail();notice('Выполняется запрос…');try{if(demo){notice(demo.decide(selected,fields.text).message);sessionStorage.removeItem(old);return}const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:selected,...fields})});const data=await r.json();if(r.ok&&path==='/decision')sessionStorage.removeItem(old);notice(data.message||'Запрос отклонён')}catch{notice('Соединение прервано. Проверьте журнал перед повтором.')}finally{busy=false;try{await refresh()}catch{detail();notice('Сервис недоступен. Текст сохранён в этой вкладке.')}}}
el('answer').oninput=()=>{sessionStorage.setItem(key(),el('answer').value);actions()};el('suggest').onclick=()=>send('/suggest',{});
for(const id of ['search','status','priority'])el(id).oninput=()=>{if(!busy){list(true);detail()}};
window.addEventListener('DOMContentLoaded',async()=>{try{if(location.hostname.endsWith('.github.io'))demo=await createBrowserDemo();session=await get('/session');el('who').textContent=session.actor+' · ORG-A';await refresh()}catch{notice('Не удалось открыть рабочее место. Обновите страницу.')}});
setInterval(timer,10000);
setInterval(async()=>{if(busy||loading||document.hidden||document.activeElement===el('answer')||!session.actor)return;loading=true;try{await refresh()}catch{notice('Связь с сервером прервана.')}finally{loading=false}},20000);
</script></body></html>
